<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Comparison Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0e17;
            --bg-alt: #111827;
            --panel-bg: #1a2235;
            --border: #2a3a52;
            --text: #e2e8f0;
            --text-dim: #8899aa;
            --gold: #c9a84c;
            --gold-dim: rgba(201,168,76,0.15);
            --accent: #e84142;
            --success: #00ff88;
            --curve-color: #e84142;
            --bidask-color: #e8652a;
            --spot-color: #00ff88;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2em;
            color: var(--gold);
            margin-bottom: 8px;
        }
        
        header p {
            color: var(--text-dim);
            font-size: 0.9em;
        }
        
        .timeframe-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .timeframe-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .timeframe-btn:hover, .timeframe-btn.active {
            background: var(--gold-dim);
            border-color: var(--gold);
            color: var(--gold);
        }
        
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .strategy-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }
        
        .strategy-card[data-shape="curve"] { border-top: 3px solid var(--curve-color); }
        .strategy-card[data-shape="bid-ask"] { border-top: 3px solid var(--bidask-color); }
        .strategy-card[data-shape="spot"] { border-top: 3px solid var(--spot-color); }
        
        .strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .strategy-name {
            font-size: 1.2em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .strategy-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .strategy-card[data-shape="curve"] .strategy-badge { background: var(--curve-color); color: white; }
        .strategy-card[data-shape="bid-ask"] .strategy-badge { background: var(--bidask-color); color: white; }
        .strategy-card[data-shape="spot"] .strategy-badge { background: var(--spot-color); color: #0a0e17; }
        
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .metric {
            background: var(--bg-alt);
            padding: 12px;
            border-radius: 8px;
        }
        
        .metric-label {
            font-size: 0.75em;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        
        .metric-value {
            font-size: 1.1em;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .metric-value.positive { color: var(--success); }
        .metric-value.negative { color: var(--accent); }
        
        .comparison-summary {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
        }
        
        .summary-title {
            font-size: 1.3em;
            color: var(--gold);
            margin-bottom: 20px;
        }
        
        .recommendation {
            background: var(--gold-dim);
            border-left: 4px solid var(--gold);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        
        .recommendation strong {
            color: var(--gold);
        }
        
        .winner-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .winner-row:last-child {
            border-bottom: none;
        }
        
        .winner-label {
            flex: 1;
            color: var(--text-dim);
        }
        
        .winner-value {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Strategy Comparison Dashboard</h1>
            <p>Side-by-side performance analysis of LP strategies</p>
        </header>
        
        <div class="timeframe-selector">
            <button class="timeframe-btn" data-timeframe="1d">24h</button>
            <button class="timeframe-btn active" data-timeframe="7d">7d</button>
            <button class="timeframe-btn" data-timeframe="30d">30d</button>
            <button class="timeframe-btn" data-timeframe="90d">90d</button>
        </div>
        
        <div id="comparison-content">
            <div class="loading">Loading strategy data...</div>
        </div>
    </div>
    
    <script>
        const STRATEGY_DATA_URL = '/root/vaults/gentech/10-Labs/defi/strategy-comparison-data.json';
        
        let currentTimeframe = '7d';
        
        // Timeframe mapping
        const TIMEFRAME_DAYS = {
            '1d': 1,
            '7d': 7,
            '30d': 30,
            '90d': 90
        };
        
        async function loadComparisonData() {
            try {
                const response = await fetch(STRATEGY_DATA_URL + '?' + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                renderComparison(data);
            } catch (error) {
                document.getElementById('comparison-content').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e84142;">
                        <p>Failed to load strategy data: ${error.message}</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">Make sure strategy-comparison-data.json exists in 10-Labs/defi/</p>
                    </div>
                `;
            }
        }
        
        function renderComparison(data) {
            const container = document.getElementById('comparison-content');
            
            // Filter by timeframe
            const filteredData = data.filter(item => item.timeframe === currentTimeframe);
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="loading">No data available for ${currentTimeframe} timeframe</div>
                `;
                return;
            }
            
            // Build cards
            let cardsHtml = '<div class="comparison-grid">';
            filteredData.forEach(item => {
                cardsHtml += buildStrategyCard(item);
            });
            cardsHtml += '</div>';
            
            // Build summary
            const summaryHtml = buildComparisonSummary(filteredData);
            
            container.innerHTML = cardsHtml + summaryHtml;
        }
        
        function buildStrategyCard(item) {
            const { strategy, timeframe, roi_pct, total_fees_usd, sharpe_ratio, max_drawdown_pct, volatility, composite_score } = item;
            
            const roiClass = roi_pct >= 0 ? 'positive' : 'negative';
            const roiSign = roi_pct >= 0 ? '+' : '';
            
            return `
                <div class="strategy-card" data-shape="${strategy}">
                    <div class="strategy-header">
                        <div class="strategy-name">
                            ${strategy === 'curve' ? '📈 Curve' : 
                              strategy === 'bid-ask' ? '↔️ Bid-Ask' : 
                              strategy === 'spot' ? '💎 Spot' : strategy}
                            <span class="strategy-badge">${strategy}</span>
                        </div>
                        <div style="font-size: 0.9em; color: var(--text-dim);">
                            ${timeframe}
                        </div>
                    </div>
                    
                    <div class="metric-grid">
                        <div class="metric">
                            <div class="metric-label">ROI</div>
                            <div class="metric-value ${roiClass}">${roiSign}${roi_pct.toFixed(2)}%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Fees</div>
                            <div class="metric-value">$${total_fees_usd.toFixed(2)}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Sharpe Ratio</div>
                            <div class="metric-value">${sharpe_ratio !== null ? sharpe_ratio.toFixed(2) : 'N/A'}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Max Drawdown</div>
                            <div class="metric-value negative">${max_drawdown_pct.toFixed(2)}%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Volatility</div>
                            <div class="metric-value">${volatility.toFixed(2)}%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Composite Score</div>
                            <div class="metric-value" style="color: var(--gold);">${(composite_score * 100).toFixed(1)}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function buildComparisonSummary(items) {
            // Find winners
            const bestRoi = items.reduce((a, b) => a.roi_pct > b.roi_pct ? a : b);
            const bestSharpe = items.filter(i => i.sharpe_ratio !== null)
                                   .reduce((a, b) => a.sharpe_ratio > b.sharpe_ratio ? a : b);
            const lowestDrawdown = items.reduce((a, b) => a.max_drawdown_pct < b.max_drawdown_pct ? a : b);
            const bestComposite = items.reduce((a, b) => a.composite_score > b.composite_score ? a : b);
            
            // Generate recommendation
            let recommendation = '';
            if (bestComposite.sharpe_ratio !== null && bestComposite.sharpe_ratio > 1.5) {
                recommendation = `${bestComposite.strategy.toUpperCase()} wins — highest composite score with strong risk-adjusted returns (Sharpe: ${bestComposite.sharpe_ratio.toFixed(2)}).`;
            } else if (bestRoi.roi_pct > 5) {
                recommendation = `${bestRoi.strategy.toUpperCase()} leads in pure returns — ${bestRoi.roi_pct.toFixed(2)}% ROI, but check drawdown before allocating.`;
            } else if (lowestDrawdown.max_drawdown_pct < 10) {
                recommendation = `${lowestDrawdown.strategy.toUpperCase()} is safest — lowest drawdown (${lowestDrawdown.max_drawdown_pct.toFixed(2)}%), good for conservative allocation.`;
            } else {
                recommendation = `No clear winner — strategies are similar. Consider diversifying across all three.`;
            }
            
            return `
                <div class="comparison-summary">
                    <div class="summary-title">🏆 Comparison Summary</div>
                    
                    <div class="recommendation">
                        <strong>Recommendation:</strong> ${recommendation}
                    </div>
                    
                    <div class="winner-row">
                        <div class="winner-label">Best ROI</div>
                        <div class="winner-value" style="color: ${bestRoi.roi_pct >= 0 ? 'var(--success)' : 'var(--accent)'}">
                            ${bestRoi.strategy} (${bestRoi.roi_pct >= 0 ? '+' : ''}${bestRoi.roi_pct.toFixed(2)}%)
                        </div>
                    </div>
                    
                    <div class="winner-row">
                        <div class="winner-label">Best Risk-Adjusted (Sharpe)</div>
                        <div class="winner-value" style="color: var(--gold);">
                            ${bestSharpe.strategy} (${bestSharpe.sharpe_ratio !== null ? bestSharpe.sharpe_ratio.toFixed(2) : 'N/A'})
                        </div>
                    </div>
                    
                    <div class="winner-row">
                        <div class="winner-label">Lowest Drawdown</div>
                        <div class="winner-value" style="color: var(--success);">
                            ${lowestDrawdown.strategy} (${lowestDrawdown.max_drawdown_pct.toFixed(2)}%)
                        </div>
                    </div>
                    
                    <div class="winner-row">
                        <div class="winner-label">Best Overall (Composite)</div>
                        <div class="winner-value" style="color: var(--gold);">
                            ${bestComposite.strategy} (${(bestComposite.composite_score * 100).toFixed(1)})
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Event listeners
        document.querySelectorAll('.timeframe-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTimeframe = btn.dataset.timeframe;
                loadComparisonData();
            });
        });
        
        // Load data on page load
        loadComparisonData();
    </script>
</body>
</html>
